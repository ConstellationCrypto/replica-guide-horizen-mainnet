version: '3.4'

volumes:
  reth_data:
  reth_logs:

services:
  l2:
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-reth:v2.6.1
    platform: linux/amd64
    restart: always
    environment:
      - RUST_BACKTRACE=full
    ports:
      - "0.0.0.0:${OP_RETH_METRICS_PORT:-9001}:9001"
      - "0.0.0.0:${OP_RETH_DISCOVERY_PORT:-30303}:30303/tcp"
      - "0.0.0.0:${OP_RETH_DISCOVERY_PORT:-30303}:30303/udp"
      - "0.0.0.0:${OP_RETH_RPC_PORT:-8545}:8545"
      - "0.0.0.0:${OP_RETH_WS_PORT:-8546}:8546"
      - "0.0.0.0:${OP_RETH_ENGINE_PORT:-8551}:8551"
    volumes:
      - "${PWD}/reth_data:/db"
      - reth_logs:/root/logs
      - "${PWD}:/work:ro"
    command: >
      node
      --rollup.disable-tx-pool-gossip
      --rollup.sequencer="https://horizen.calderachain.xyz/http"
      --rollup.historicalrpc="https://horizen.calderachain.xyz/http"
      --datadir /db
      --storage.v2 false
      --chain /work/genesis.json
      --metrics 0.0.0.0:9001
      --log.file.directory /root/logs
      --authrpc.addr 0.0.0.0
      --authrpc.port 8551
      --authrpc.jwtsecret /work/jwt-secret.txt
      --http
      --http.addr 0.0.0.0
      --http.port 8545
      --http.api eth,net,web3,debug,txpool
      --http.corsdomain *
      --ws
      --ws.addr 0.0.0.0
      --ws.port 8546
      --ws.origins *
      --ipcdisable
      --addr 0.0.0.0
      --port 30303
      --disable-discovery
      --trusted-peers enode://ca965bbc0cfce267ed50a8b03dd394a448f39ff234810f1256044f6825a5b5b4b85ef258914bd6671217e8efcae54ed38d73a52d439f860989172c625d16d492@52.13.24.214:30303,enode://ca965bbc0cfce267ed50a8b03dd394a448f39ff234810f1256044f6825a5b5b4b85ef258914bd6671217e8efcae54ed38d73a52d439f860989172c625d16d492@32.184.93.244:30303,enode://ca965bbc0cfce267ed50a8b03dd394a448f39ff234810f1256044f6825a5b5b4b85ef258914bd6671217e8efcae54ed38d73a52d439f860989172c625d16d492@32.185.207.253:30303

  op-node:
    depends_on:
      - l2
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-node:v1.19.11
    platform: linux/amd64
    stop_signal: SIGINT
    stop_grace_period: 30s
    environment:
      OP_NODE_L1_BEACON_IGNORE: "true"
      OP_NODE_ROLLUP_L1_CHAIN_CONFIG: /work/l1_chain_config.json
      OP_NODE_OVERRIDE_ISTHMUS: "1789646400"
    restart: always
    command: >
      op-node
      --l1="${L1_RPC_URL}"
      --l2=http://l2:8551
      --l2.jwt-secret=/work/jwt-secret.txt
      --l2.enginekind=reth
      --sequencer.enabled=false
      --verifier.l1-confs=10
      --rollup.config=/work/rollup.json
      --rpc.addr=0.0.0.0
      --rpc.port=8545
      --p2p.no-discovery=false
      --p2p.listen.ip=0.0.0.0
      --p2p.listen.tcp=9003
      --p2p.listen.udp=9003
      --p2p.static=/ip4/44.255.138.48/tcp/9003/p2p/16Uiu2HAm1yyHgvkvdwQDJs7qNYGgPLNSAmWNtCSqR6t4CTZcmtez
      --p2p.priv.path=/work/p2p-node-key.txt
      --syncmode=execution-layer
      --metrics.enabled
      --metrics.addr=0.0.0.0
      --metrics.port=7300
      --pprof.enabled
      --rpc.enable-admin
    ports:
      - "7545:8545"
      - "9003:9003"
      - "7300:7300"
      - "6060:6060"
    volumes:
      - "${PWD}:/work:ro"
